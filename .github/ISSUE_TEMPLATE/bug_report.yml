name: Bug report
description: Something doesn't work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Remove passwords, hostnames and IP addresses** from everything you paste.
        Security problems go to the private channel in SECURITY.md, not here.
  - type: dropdown
    id: connector
    attributes:
      label: Connector
      options:
        - AMQJMSConnection (ActiveMQ)
        - RabbitJMSConnection (RabbitMQ)
        - KafkaJMSConnection (Kafka)
        - QUtil / PropertyBean / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: plugin-jmsq version or commit
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: broker
    attributes:
      label: Broker and version
      placeholder: ActiveMQ Classic 5.18.3
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: Temurin 11.0.22
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or code to reproduce
      description: The smallest code and settings that show the problem.
      render: java
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      render: text
